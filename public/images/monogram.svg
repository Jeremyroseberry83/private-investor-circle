<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Private Investor Circle">
  <circle cx="32" cy="32" r="29.4" fill="none" stroke="#D8C3A5" stroke-width="1.1"/>
  <!-- R and J interlocked: the J's bowl crosses the R's leg so the pair reads
       as one mark before it resolves into initials. -->
  <g font-family="Georgia, 'Times New Roman', serif" font-style="italic" fill="#D8C3A5" text-anchor="middle">
    <text x="27.5" y="40" font-size="30" opacity="0.92">R</text>
    <text x="34.5" y="47" font-size="34" opacity="0.7">J</text>
  </g>
</svg>
